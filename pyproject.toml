[project]
name = "budget-app-api"
version = "0.1.0"
description = "Eves budgeting app"
authors = [
    {name = "Eve Ndung'u"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "uvicorn[standard] (>=0.34.3,<0.35.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "alembic (>=1.16.1,<2.0.0)",
    "google-auth (>=2.40.0)",
    "python-jose[cryptography] (>=3.4.0)",
    "httpx (>=0.27.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",    # type annotations not enforced yet
    "D",      # docstrings
    "ERA",    # commented-out code
    "FIX",    # fixme markers
    "TD",     # todo markers
    "T20",    # print statements (dev convenience)
    "TRY003", # exception message style
    "EM101",  # exception string literal style
    "TC001",  # typing-only first-party imports
    "TC002",  # typing-only third-party imports
    "TC003",  # typing-only stdlib imports
    "S101",   # use of assert
    "COM812", # trailing comma (conflicts with formatter)
    "ISC001", # implicit string concat (conflicts with formatter)
    "PLR0913", # too many function arguments (normal for FastAPI routes)
    "PLR0915", # too many statements (seed/setup functions are intentionally long)
    "PLR2004", # magic value comparisons (HTTP status codes are self-documenting)
    "PLR0911", # too many return statements (complex route/dashboard functions)
    "S104",   # binding to all interfaces (expected for server entrypoint)
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.9"
mypy = "^1.20.0"
pytest = "^9.0.2"

