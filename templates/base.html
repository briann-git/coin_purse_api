<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Coin Purse{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-full text-slate-800 antialiased">

  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <span class="font-bold text-xl tracking-tight select-none">Coin Purse</span>
      <div class="flex items-center gap-6">
        {% if user_id is defined %}
        <nav class="flex gap-4 text-sm">
          <a href="/ui/dashboard/{{ user_id }}"
             class="text-indigo-200 hover:text-white transition-colors {% block nav_dashboard %}{% endblock %}">
            Dashboard
          </a>
          <a href="/ui/transactions/{{ user_id }}"
             class="text-indigo-200 hover:text-white transition-colors {% block nav_transactions %}{% endblock %}">
            Transactions
          </a>
          <a href="/ui/budgets/{{ user_id }}"
             class="text-indigo-200 hover:text-white transition-colors {% block nav_budgets %}{% endblock %}">
            Budgets
          </a>
          <a href="/ui/config/{{ user_id }}"
             class="text-indigo-200 hover:text-white transition-colors {% block nav_config %}{% endblock %}">
            Settings
          </a>
        </nav>
        {% endif %}
        <div class="flex items-center gap-4 text-sm">
          {% block header_right %}{% endblock %}
          {% if session_user_name is defined and session_user_name %}
          <span class="text-indigo-300 hidden sm:block">{{ session_user_name }}</span>
          <form action="/auth/logout" method="post">
            <button type="submit"
                    class="text-indigo-200 hover:text-white transition-colors">
              Sign out
            </button>
          </form>
          {% endif %}
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
